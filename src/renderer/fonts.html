<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; style-src 'self' 'unsafe-inline'"
    />
    <title>Kiểu chữ</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .box {
        margin: 8px;
        height: calc(100% - 16px);
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        color: #2b2410;
        background: linear-gradient(170deg, #fffdf0, #ffe98f);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px 4px;
      }
      .ttl {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .x {
        border: 0;
        background: transparent;
        font-size: 17px;
        line-height: 1;
        color: rgba(43, 36, 16, 0.6);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }
      .x:hover { background: rgba(0, 0, 0, 0.08); color: #2b2410; }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 8px;
        flex-wrap: wrap;
      }
      .search {
        flex: 1;
        min-width: 130px;
        border: 1px solid rgba(43, 36, 16, 0.22);
        background: rgba(255, 255, 255, 0.75);
        border-radius: 8px;
        padding: 6px 9px;
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      .search:focus { border-color: rgba(43, 36, 16, 0.5); }
      .list {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 8px;
      }
      .row {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 9px;
        padding: 7px 9px;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .row:hover { background: rgba(0, 0, 0, 0.07); }
      .row.now {
        background: rgba(255, 255, 255, 0.72);
        border-color: rgba(43, 36, 16, 0.45);
      }
      .row.now .nm::after { content: " ✓"; }
      .nm {
        display: block;
        font-size: 12px;
        opacity: 0.85;
      }
      .pv {
        display: block;
        font-size: 17px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        padding: 14px 10px;
        font-size: 13px;
        opacity: 0.7;
      }
      .foot {
        padding: 7px 12px 9px;
        font-size: 11px;
        border-top: 1px solid rgba(43, 36, 16, 0.14);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <header class="head">
        <span class="ttl">Kiểu chữ cho giấy nhớ</span>
        <button class="x" id="btnClose" title="Đóng (Esc)">×</button>
      </header>
      <div class="top">
        <input class="search" id="q" placeholder="Tìm font…" spellcheck="false" autocomplete="off" />
      </div>
      <div class="list" id="list"></div>
      <footer class="foot" id="info"></footer>
    </div>
    <script src="fonts.js"></script>
  </body>
</html>
